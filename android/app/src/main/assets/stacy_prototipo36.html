<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STACY — Visual Core • Local Nucleus</title><style>:root{--o:#ff7418;--bg:#020202;--panel:#0a0705;--line:rgba(255,116,24,.28);--fg:#f5efe9}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}button,input{font:inherit}.app{height:100%;display:flex;flex-direction:column}.top{height:100px;position:relative;flex:0 0 100px}.brand{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:28px;letter-spacing:8px;color:var(--o)}.status{position:absolute;left:50%;top:65px;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:#ddd;white-space:nowrap}.status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:#39ff72;box-shadow:0 0 10px #39ff72}.status.busy:before{background:var(--o);box-shadow:0 0 10px var(--o)}.status.err:before{background:#f33;box-shadow:0 0 10px #f33}.main{min-height:0;flex:1;overflow:auto;padding:14px}.orbwrap{height:180px;display:grid;place-items:center}.orb{width:110px;height:110px;border:2px solid var(--o);border-radius:50%;position:relative;box-shadow:0 0 35px rgba(255,116,24,.2)}.orb:before{content:"";position:absolute;inset:35px;border-radius:50%;background:var(--o);box-shadow:0 0 22px var(--o)}.orb:after{content:"";position:absolute;left:-22px;right:-22px;top:47px;height:14px;border:1px solid var(--o);border-radius:50%;transform:rotate(25deg);animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(385deg)}}.orb.thinking{animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.04);filter:brightness(1.3)}}.log{max-width:720px;margin:auto;display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);white-space:pre-wrap;line-height:1.45;font-size:14px}.msg.user{align-self:flex-end;background:var(--o);color:#170a03;border:0}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer input{min-width:0;flex:1;height:46px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:0 13px}.btn{height:46px;min-width:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--o)}.send{background:var(--o);color:#180b03}.drawer{position:fixed;z-index:20;inset:0 auto 0 0;width:290px;background:#050403;border-right:1px solid var(--line);padding:20px;transform:translateX(-105%);transition:.2s}.drawer.open{transform:none}.drawer button{display:block;width:100%;height:44px;margin:5px 0;text-align:left;padding:0 12px;background:transparent;color:var(--fg);border:1px solid transparent;border-radius:10px}.drawer button:hover{border-color:var(--line)}.back{position:fixed;z-index:19;inset:0;background:rgba(0,0,0,.55);display:none}.back.open{display:block}.menu{position:fixed;z-index:22;left:12px;top:20px}</style></head><body><div id="app"></div><script>(()=>{const KEY='stacy-core-v1';const seed=()=>({name:'Danley',memory:[],projects:['STACY'],goals:['disciplina','foco','consistência'],prefs:[],tasks:[],messages:[],focus:null,voice:true});let s=load(),phase='ONLINE';function load(){try{return {...seed(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return seed()}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function norm(v){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(text,role='stacy'){s.messages.push({role,text,at:Date.now()});s.messages=s.messages.slice(-80);save();render()}function greeting(){const h=new Date().getHours();const p=h>=5&&h<12?'Bom dia':h>=12&&h<18?'Boa tarde':'Boa noite';return `${p}, ${s.name}. Estou pronta. Núcleo local online.`}function setPhase(p){phase=p;renderStatus()}function renderStatus(){const e=document.querySelector('.status'),o=document.querySelector('.orb');if(!e)return;e.textContent=phase;e.className='status '+(phase==='ERRO'?'err':phase==='ONLINE'||phase==='RESPONDENDO'?'':'busy');if(o)o.className='orb '+(['PENSANDO','PESQUISANDO','EXECUTANDO'].includes(phase)?'thinking':'')}function help(){return 'Núcleo local online, senhor. Comandos reais:\n• nova tarefa …\n• minhas tarefas\n• concluir tarefa …\n• apagar tarefa …\n• lembrar que …\n• meu objetivo é …\n• novo projeto …\n• prefiro …\n• esquecer …\n• memória / briefing\n• iniciar foco 25\n• parar foco\n• fechar o dia\n• que horas são\n• abrir calendário\n• abrir configurações\n• compartilhar …\n• ajuda\nPerguntas comuns seguem para o CORE Android quando disponível.'}function reply(t){say(t);setPhase('RESPONDENDO');setTimeout(()=>{if(phase==='RESPONDENDO')setPhase('ONLINE')},1200);if(s.voice&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}}function command(raw){const t=raw.trim(),k=norm(t);if(!k)return reply('Não ouvi nada, senhor.');if(['ajuda','help','comandos'].includes(k))return reply(help());if(['oi','ola','oie','e ai','hey','stacy','boa noite','bom dia','boa tarde','boa madrugada'].includes(k))return reply(greeting());if(['que horas sao','que horas','que dia e hoje'].includes(k))return reply(new Date().toLocaleString('pt-BR',{dateStyle:'full',timeStyle:'short'}));if(['memoria','minha memoria','o que voce sabe','briefing','status','estado do nucleo'].includes(k))return reply(`Briefing local, ${s.name}. Projetos: ${s.projects.join(', ')||'nenhum'}. Objetivos: ${s.goals.join(', ')||'nenhum'}. Tarefas abertas: ${s.tasks.filter(x=>!x.done).map(x=>x.title).join('; ')||'nenhuma'}. Memórias: ${s.memory.length}.`);if(['minhas tarefas','tarefas','listar tarefas'].includes(k)){const a=s.tasks.filter(x=>!x.done);return reply(a.length?'Tarefas abertas:\n'+a.map((x,i)=>`${i+1}. ${x.title}`).join('\n'):'Não há tarefas abertas, senhor.')}let m=t.match(/^nova tarefa\s+(.+)/i);if(m){s.tasks.unshift({id:crypto.randomUUID?.()||String(Date.now()),title:m[1].trim(),done:false});save();return reply(`Tarefa registrada de verdade: ${m[1].trim()}.`)}m=t.match(/^(concluir|finalizar|terminar) tarefa\s+(.+)/i);if(m){const q=norm(m[2]),x=s.tasks.find(x=>!x.done&&(norm(x.title)===q||norm(x.title).includes(q)));if(!x)return reply('Não achei essa tarefa aberta, senhor.');x.done=true;save();return reply(`Concluída: ${x.title}.`)}m=t.match(/^(apagar|remover|excluir) tarefa\s+(.+)/i);if(m){const q=norm(m[2]),i=s.tasks.findIndex(x=>norm(x.title)===q||norm(x.title).includes(q));if(i<0)return reply('Não achei essa tarefa para apagar, senhor.');const [x]=s.tasks.splice(i,1);save();return reply(`Tarefa removida: ${x.title}.`)}m=t.match(/^(lembrar que|lembre que|grave que|anote que)\s+(.+)/i);if(m){s.memory.unshift(m[2].trim());save();return reply(`Gravei na memória: ${m[2].trim()}.`)}m=t.match(/^(meu objetivo é|meu objetivo e|objetivo)\s+(.+)/i);if(m){s.goals.unshift(m[2].trim());save();return reply(`Objetivo registrado: ${m[2].trim()}.`)}m=t.match(/^(novo projeto|projeto)\s+(.+)/i);if(m){s.projects.unshift(m[2].trim());save();return reply(`Projeto registrado: ${m[2].trim()}.`)}m=t.match(/^prefiro\s+(.+)/i);if(m){s.prefs.unshift(m[1].trim());save();return reply(`Preferência registrada: ${m[1].trim()}.`)}m=t.match(/^(esquecer|apagar da memoria|remover da memoria)\s+(.+)/i);if(m){const q=norm(m[2]),before=s.memory.length;s.memory=s.memory.filter(x=>!norm(x).includes(q));save();return reply(before===s.memory.length?'Não achei isso na memória, senhor.':'Removi da memória, senhor.')}m=t.match(/^(iniciar foco|comecar foco|modo foco)(?:\s+(\d{1,3}))?$/i);if(m){const min=Number(m[2]||25);if(min<5||min>120)return reply('O foco aceita de 5 a 120 minutos, senhor.');s.focus={minutes:min,started:Date.now()};save();return reply(`Foco de ${min} minutos iniciado, senhor.`)}if(['parar foco','encerrar foco','cancelar foco'].includes(k)){if(!s.focus)return reply('Não há foco em curso, senhor.');const min=Math.max(0,Math.round((Date.now()-s.focus.started)/60000));s.focus=null;save();return reply(`Foco encerrado. Foram contabilizados ${min} minuto(s).`)}m=t.match(/^(fechar o dia|encerrar o dia|fechar dia)(?:\s+(.+))?$/i);if(m){s.memory.unshift(`Fecho do dia: ${m[2]||'sem nota'}`);save();return reply('Dia fechado e registrado na memória, senhor.')}if(k.startsWith('abrir calendario')){setPhase('EXECUTANDO');if(window.Android?.stacyOpenCalendar){Android.stacyOpenCalendar();return}return reply('O calendário Android não está conectado neste ambiente.')}if(k.startsWith('abrir configuracoes')||k.startsWith('abrir android')){setPhase('EXECUTANDO');if(window.Android?.stacyOpenAndroidSettings){Android.stacyOpenAndroidSettings();return}return reply('As configurações Android não estão conectadas neste ambiente.')}m=t.match(/^compartilhar\s+(.+)/i);if(m){setPhase('EXECUTANDO');if(window.Android?.stacyShareText){Android.stacyShareText(m[1]);return}return reply('O compartilhamento Android não está conectado neste ambiente.')}setPhase('PENSANDO');if(window.Android?.stacySend){Android.stacySend(t);return}return reply('O núcleo local não reconheceu esse comando e não há um CORE conversacional conectado neste ambiente, senhor.')}function send(){const i=document.querySelector('#message'),t=i.value.trim();if(!t)return;i.value='';say(t,'user');command(t)}function render(){document.querySelector('#app').innerHTML=`<div class="app"><button class="btn menu" onclick="toggleMenu()">☰</button><div class="top"><div class="brand">STACY</div><div class="status">${phase}</div></div><main class="main"><div class="orbwrap"><div class="orb"></div></div><div class="log">${s.messages.map(m=>`<div class="msg ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div></main><form class="composer" onsubmit="event.preventDefault();send()"><button type="button" class="btn" onclick="voice()">🎙</button><input id="message" autocomplete="off" placeholder="Fale com a STACY"><button class="btn send">➤</button></form><div class="back" onclick="toggleMenu()"></div><aside class="drawer"><h2 style="color:var(--o);letter-spacing:4px">STACY</h2><button onclick="panel('Tarefas')">Tarefas</button><button onclick="panel('Memória')">Memória</button><button onclick="panel('Conversas')">Conversas</button><button onclick="panel('Foco')">Foco</button><button onclick="panel('Ajustes')">Ajustes</button></aside></div>`;renderStatus()}function toggleMenu(){document.querySelector('.drawer')?.classList.toggle('open');document.querySelector('.back')?.classList.toggle('open')}function panel(name){toggleMenu();if(name==='Tarefas')return reply(s.tasks.length?s.tasks.map((x,i)=>`${i+1}. ${x.done?'✓':'•'} ${x.title}`).join('\n'):'Nenhuma tarefa registrada.');if(name==='Memória')return reply(`Memória: ${s.memory.join('; ')||'vazia'}`);if(name==='Foco')return reply(s.focus?`Foco ativo: ${s.focus.minutes} min.`:'Nenhum foco ativo.');if(name==='Ajustes'){if(window.Android?.stacyConfigureAi){Android.stacyConfigureAi();return}return reply('Configuração de IA nativa indisponível neste ambiente.')}return reply(s.messages.filter(x=>x.role==='stacy').slice(-8).map(x=>x.text).join('\n\n')||'Nenhuma conversa.')}function voice(){if(window.Android?.stacyVoice){Android.stacyVoice();return}if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window))return reply('Entrada por voz indisponível neste ambiente, senhor.');const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='pt-BR';r.onstart=()=>setPhase('OUVINDO');r.onresult=e=>{const t=e.results[0][0].transcript;document.querySelector('#message').value=t;send()};r.onerror=()=>setPhase('ERRO');r.onend=()=>{if(phase==='OUVINDO')setPhase('ONLINE')};r.start()}window.stacyNativeState=x=>{const map={online:'ONLINE',ouvindo:'OUVINDO',pensando:'PENSANDO',pesquisando:'PESQUISANDO',executando:'EXECUTANDO',respondendo:'RESPONDENDO',erro:'ERRO',offline:'OFFLINE'};setPhase(map[x]||String(x).toUpperCase())};window.stacyNativeResponse=text=>{say(text);setPhase('RESPONDENDO');setTimeout(()=>setPhase('ONLINE'),1200)};window.stacyNativeUpdateStatus=status=>{if(status)console.log('STACY update:',status)};window.toggleMenu=toggleMenu;window.send=send;window.voice=voice;window.panel=panel;if(!s.messages.length)s.messages.push({role:'stacy',text:greeting(),at:Date.now()});save();render()})();</script></body></html>
