<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STACY — Visual Core 14 • Space Stacked</title>
<style>
:root{
  --orange:#ff7418;
  --orange2:#ff9b45;
  --orange3:#ffb36d;
  --bg:#020202;
  --panel:rgba(8,5,3,.94);
  --line:rgba(255,116,24,.30);
  --muted:#918980;
  --white:#f5efe9;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'STACY SpaceStacked',Arial,Helvetica,sans-serif;color:var(--white)}
button,input{font:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
#scene{position:absolute;left:0;right:0;top:132px;bottom:102px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.top{position:absolute;top:0;left:0;right:0;height:132px;z-index:20;pointer-events:none}
.brand{
  position:absolute;left:50%;top:calc(env(safe-area-inset-top, 0px) + 12px);transform:translateX(-50%);
  font-weight:500;font-size:34px;letter-spacing:8px;color:var(--orange);
  text-shadow:0 0 16px rgba(255,116,24,.16)
}
.menuBtn{
  position:absolute;left:0;top:calc(env(safe-area-inset-top, 0px) + 22px);width:16px;height:18px;border:0;background:none;
  padding:0;pointer-events:auto;cursor:pointer
}
.menuBtn span{display:block;width:14px;height:2px;margin:0 0 3px;border-radius:3px;background:var(--orange);box-shadow:0 0 6px rgba(255,116,24,.25)}
.status{
  position:absolute;left:50%;top:94px;transform:translateX(-50%);
  font-weight:500;font-size:13px;letter-spacing:4px;color:#ded8d2;white-space:nowrap
}
.status:before{
  content:"";display:inline-block;width:12px;height:12px;margin-right:13px;
  vertical-align:-1px;border-radius:50%;background:#dfffe8;
  box-shadow:0 0 13px rgba(180,255,205,.78);transition:background .25s ease,box-shadow .25s ease
}
.status.status-online:before{background:#39ff72;box-shadow:0 0 7px #39ff72,0 0 16px rgba(57,255,114,.9)}
.status.status-offline:before{background:#ff3030;box-shadow:0 0 7px #ff3030,0 0 16px rgba(255,48,48,.9)}
.stateBar{
  position:absolute;left:50%;top:126px;transform:translateX(-50%);
  width:74px;height:2px;border-radius:2px;background:var(--orange);
  box-shadow:0 0 12px rgba(255,116,24,.45);z-index:10
}
.sideTrace{position:absolute;top:50%;width:52px;height:1px;background:var(--orange);opacity:.58;z-index:4;box-shadow:0 0 7px rgba(255,116,24,.2)}
.sideTrace.left{left:10px}.sideTrace.right{right:10px}
.sideTrace:before,.sideTrace:after{content:"";position:absolute;height:1px;background:rgba(255,116,24,.38)}
.sideTrace:before{width:28px;top:-13px}.sideTrace:after{width:20px;top:13px}
.sideTrace.left:before{left:9px;transform:rotate(-18deg)}.sideTrace.left:after{left:21px;transform:rotate(17deg)}
.sideTrace.right:before{right:9px;transform:rotate(18deg)}.sideTrace.right:after{right:21px;transform:rotate(-17deg)}
/* Barra de mensagem */
.composer{
  position:absolute;left:50%;bottom:23px;transform:translateX(-50%);
  width:min(92%,680px);height:61px;z-index:30;
  display:flex;align-items:center;gap:8px;padding:7px 9px;
  border:1px solid rgba(255,116,24,.34);border-radius:16px;
  background:linear-gradient(180deg,rgba(12,7,4,.96),rgba(4,3,2,.96));
  box-shadow:0 0 22px rgba(255,116,24,.06),inset 0 0 16px rgba(255,116,24,.025)
}
.iconBtn{
  flex:0 0 42px;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,116,24,.32);
  background:rgba(255,116,24,.045);color:var(--orange);cursor:pointer;font-size:25px;line-height:1
}
#message{min-width:0;flex:1;height:42px;border:0;outline:0;background:transparent;color:#eee8e2;font-size:14px}
#message::placeholder{color:#70675f}
.send{
  width:42px;height:42px;border:0;border-radius:12px;background:var(--orange);
  color:#180b03;font-size:18px;font-weight:bold;cursor:pointer
}
/* menu lateral */
.drawer{
  position:absolute;left:0;top:0;bottom:0;width:min(82%,315px);z-index:50;
  transform:translateX(-105%);transition:transform .28s ease;
  background:linear-gradient(180deg,rgba(9,6,4,.985),rgba(2,2,2,.985));
  border-right:1px solid rgba(255,116,24,.38);box-shadow:12px 0 36px rgba(0,0,0,.55);
  padding:26px 18px
}
.drawer.open{transform:translateX(0)}
.drawerHead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 20px;border-bottom:1px solid rgba(255,116,24,.18)}
.drawerBrand{font-size:21px;letter-spacing:6px;color:var(--orange)}
.close{border:0;background:none;color:var(--orange);font-size:27px;cursor:pointer}
.nav{padding-top:15px;display:flex;flex-direction:column;gap:7px}
.nav button{
  width:100%;height:47px;border:1px solid transparent;border-radius:11px;background:transparent;
  color:#c9c1ba;text-align:left;padding:0 14px;font-weight:400;font-size:14px;letter-spacing:.25px;cursor:pointer
}
.nav button:hover,.nav button.active{border-color:rgba(255,116,24,.28);background:rgba(255,116,24,.08);color:#fff}
.nav b{display:inline-block;width:28px;color:var(--orange);font-size:17px}
.drawerFoot{position:absolute;left:22px;right:22px;bottom:24px;color:#5f5751;font-size:10px;line-height:1.5}
/* mini cards */
.info{
  position:absolute;left:50%;transform:translateX(-50%);bottom:94px;z-index:15;
  min-width:190px;max-width:82%;padding:7px 12px;border:1px solid rgba(255,116,24,.18);
  border-radius:10px;background:rgba(4,3,2,.72);text-align:center;backdrop-filter:blur(5px);
  color:#857b72;font-size:10px;letter-spacing:1px
}
.progress{display:none;margin-top:5px;height:2px;background:rgba(255,116,24,.15);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:58%;background:var(--orange);box-shadow:0 0 7px var(--orange)}
#veil{display:none;position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.45)}
@media(max-height:700px){
 .brand{top:calc(env(safe-area-inset-top, 0px) + 12px);font-size:34px}.menuBtn{top:calc(env(safe-area-inset-top, 0px) + 18px)}.status{top:78px}
 .top{height:120px}#scene{top:120px}
 .stateBar{top:112px}.info{bottom:88px}
}

.responsePanel{display:none;position:absolute;left:50%;top:175px;transform:translateX(-50%);width:min(88%,620px);z-index:18}
.responseBubble{border:1px solid rgba(255,116,24,.30);border-radius:14px;padding:16px 17px;background:rgba(7,4,2,.88);color:#eee8e2;font-size:15px;line-height:1.45;box-shadow:0 0 24px rgba(255,116,24,.05);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease}
#app.responding .status,#app.responding .stateBar,#app.responding .context{display:none}
#app.responding .responsePanel{display:block}
#app.responding .responseBubble{opacity:1;transform:translateY(0)}
#app.responding #scene{opacity:.22;transform:scale(.78);transform-origin:50% 42%;transition:opacity .45s ease,transform .45s ease}
#scene{transition:opacity .45s ease,transform .45s ease}

/* Constelações ORIGINAIS DR / LM — versão discreta para o cabeçalho */
.constellation{
  position:absolute;top:83px;width:58px;height:38px;z-index:8;pointer-events:none;
  opacity:.25;filter:drop-shadow(0 0 2px rgba(255,116,24,.05));
}
.constellation.left{left:calc(50% - 119px)}
.constellation.right{right:calc(50% - 119px);transform:rotate(180deg);transform-origin:center center}
.constellation svg{width:100%;height:100%;overflow:visible}
.constellation line{stroke:rgba(255,145,72,.38);stroke-width:.48;stroke-linecap:round}
.constellation circle{fill:#ffad70;opacity:.72}
.constellation .dim{fill:#b85d22;opacity:.17}
@media(max-width:390px){
 .constellation.left{left:calc(50% - 113px)}
 .constellation.right{right:calc(50% - 113px)}
 .constellation{width:52px;height:34px;opacity:.25}
}

/* Partículas avulsas — mesma presença discreta das constelações DR/LM */
.ambient-particles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;opacity:.25}
.ambient-particles i{position:absolute;display:block;width:2px;height:2px;border-radius:50%;background:rgba(255,145,72,.9);box-shadow:0 0 3px rgba(255,116,24,.18);transform:translate(-50%,-50%)}
.ambient-particles i:nth-child(3n){width:1.5px;height:1.5px;opacity:.8}
.ambient-particles i:nth-child(4n){width:1px;height:1px;opacity:.65}

/* Partículas de entorno das constelações */
.constellation-particles{position:absolute;top:72px;left:0;right:0;height:62px;z-index:7;pointer-events:none;}
.constellation-particles i{position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:rgba(255,145,72,.9);opacity:.25;box-shadow:0 0 3px rgba(255,116,24,.12);}

/* Preenchimento espacial extra na faixa superior, mantendo a mesma opacidade das DR/LM */
.upper-fill{position:absolute;left:0;right:0;top:0;height:45%;z-index:5;pointer-events:none;overflow:hidden;opacity:.25}
.upper-fill i{position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:rgba(255,145,72,.9);box-shadow:0 0 3px rgba(255,116,24,.12);transform:translate(-50%,-50%)}
.upper-fill i:nth-child(3n){width:1px;height:1px;opacity:.8}
.upper-fill i:nth-child(5n){width:2px;height:2px;opacity:.55}
.brand{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:20;font-size:30px;}
</style>

<style>
/* STACY — Sidebar / Drawer */
.stacy-drawer-backdrop{
  position:fixed; inset:0; z-index:80;
  background:rgba(0,0,0,.58);
  opacity:0; pointer-events:none;
  transition:opacity .28s ease;
  backdrop-filter:blur(2px);
}
.stacy-drawer{
  position:fixed; z-index:90; left:0; top:0; bottom:0;
  width:min(82vw,330px);
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
  box-sizing:border-box;
  background:linear-gradient(180deg,rgba(13,11,10,.985),rgba(6,6,6,.99));
  border-right:1px solid rgba(255,112,25,.20);
  box-shadow:18px 0 50px rgba(0,0,0,.48), 2px 0 22px rgba(255,91,0,.05);
  transform:translateX(-104%);
  transition:transform .34s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;
}
.stacy-drawer.open{transform:translateX(0)}
.stacy-drawer-backdrop.open{opacity:1;pointer-events:auto}
.stacy-drawer::after{
  content:""; position:absolute; top:0; right:-1px; width:1px; height:100%;
  background:linear-gradient(180deg,transparent,rgba(255,102,15,.55),transparent);
}
.stacy-drawer-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 4px 20px;
}
.stacy-drawer-brand{
  font-family:'STACY SpaceStacked',sans-serif;
  font-size:21px; letter-spacing:1.8px; color:#f5eee8;
}
.stacy-drawer-brand span{color:#ff751f}
.stacy-drawer-close{
  width:38px;height:38px;border:1px solid rgba(255,117,31,.18);
  border-radius:12px;background:rgba(255,117,31,.045);color:#e9ded6;
  font-size:22px;line-height:1;display:grid;place-items:center;
}
.stacy-drawer-rule{
  height:1px;margin:0 4px 17px;
  background:linear-gradient(90deg,rgba(255,117,31,.42),rgba(255,117,31,.04),transparent);
}
.stacy-nav{display:flex;flex-direction:column;gap:6px}
.stacy-nav-item{
  appearance:none;width:100%;border:1px solid transparent;
  background:transparent;color:#c8beb7;

<script type="module">
import * as THREE from "three";

const canvas=document.getElementById("orb");
const sceneBox=document.getElementById("scene");
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,.1,100);
camera.position.z=4.7;
const root=new THREE.Group();
scene.add(root);

const ORANGE=new THREE.Color(0xff7418);
const ORANGE_BRIGHT=new THREE.Color(0xffa04a);
const WHITE=new THREE.Color(0xfff4e9);

function seeded(n){const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
function lerp(a,b,t){return a+(b-a)*t}

/* ===== ORBE: pequeno, central e sem planeta ===== */
const count=1250;
const positions=new Float32Array(count*3), seeds=new Float32Array(count);
for(let i=0;i<count;i++){
  const y=i/(count-1)*2-1;
  const rr=Math.sqrt(Math.max(0,1-y*y));
  const a=i*Math.PI*(3-Math.sqrt(5));
  const radius=.63+seeded(i+3)*.38;
  positions[i*3]=Math.cos(a)*rr*radius;
  positions[i*3+1]=y*radius;
  positions[i*3+2]=Math.sin(a)*rr*radius;
  seeds[i]=seeded(i+19);
}
const geo=new THREE.BufferGeometry();
geo.setAttribute("position",new THREE.BufferAttribute(positions,3));
geo.setAttribute("aSeed",new THREE.BufferAttribute(seeds,1));

const particleMat=new THREE.ShaderMaterial({
 transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{uTime:{value:0},uEnergy:{value:.7},uPulse:{value:.15},uColor:{value:ORANGE},uWhite:{value:WHITE}},
 vertexShader:`
 attribute float aSeed;
 uniform float uTime,uEnergy,uPulse;
 varying float vA,vT;
 void main(){
   vec3 p=position;
   float wob=sin(uTime*(.55+aSeed*1.7)+aSeed*45.0)*.022;
   p*=1.0+wob*uEnergy+uPulse*.045;
   vec4 mv=modelViewMatrix*vec4(p,1.0);
   gl_Position=projectionMatrix*mv;
   float tw=.5+.5*sin(uTime*(1.1+aSeed*2.5)+aSeed*70.0);
   vA=(.13+tw*.68)*(.58+uEnergy*.38+uPulse*.32);
   vT=tw;
   gl_PointSize=(1.8+tw*3.1+uPulse*1.5)*(3.0/max(.8,-mv.z));
 }`,
 fragmentShader:`
 uniform vec3 uColor,uWhite;
 varying float vA,vT;
 void main(){
   float d=length(gl_PointCoord-.5);
   float a=smoothstep(.5,0.,d)*vA;
   vec3 c=mix(uColor,uWhite,vT*.45);
   gl_FragColor=vec4(c,a);
 }`
});
const particles=new THREE.Points(geo,particleMat);
root.add(particles);

/* brilho central, sem esfera facetada */
function makeGlow(){
 const c=document.createElement("canvas");c.width=c.height=256;
 const x=c.getContext("2d");
 const g=x.createRadialGradient(128,128,0,128,128,128);
 g.addColorStop(0,"rgba(255,246,235,.98)");
 g.addColorStop(.08,"rgba(255,194,137,.98)");
 g.addColorStop(.22,"rgba(255,119,24,.72)");
 g.addColorStop(.52,"rgba(255,87,15,.20)");
 g.addColorStop(1,"rgba(0,0,0,0)");
 x.fillStyle=g;x.fillRect(0,0,256,256);
 return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({
 map:makeGlow(),transparent:true,opacity:.72,blending:THREE.AdditiveBlending,depthWrite:false
}));
glow.scale.set(.96,.96,1);
root.add(glow);

const coreGlow=new THREE.Sprite(new THREE.SpriteMaterial({
 map:makeGlow(),transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false
}));
coreGlow.scale.set(.42,.42,1);
root.add(coreGlow);

/* ===== ANÉIS: menores e realmente orbitais ===== */
function makeRing(radius,rx,ry,speed,opacity){
 const pts=[];
 const seg=240;
 for(let i=0;i<=seg;i++){
   const a=i/seg*Math.PI*2;
   pts.push(new THREE.Vector3(Math.cos(a)*radius,Math.sin(a)*radius,0));
 }
 const g=new THREE.BufferGeometry().setFromPoints(pts);
 const m=new THREE.LineBasicMaterial({
   color:ORANGE,transparent:true,opacity,
   blending:THREE.AdditiveBlending,depthWrite:false
 });
 const l=new THREE.Line(g,m);
 l.rotation.x=rx;l.rotation.y=ry;
 l.userData={speed,base:opacity,visualScale:1};
 root.add(l);
 return l;
}
const rings=[
 makeRing(.66,1.00,-.24,.46,.58),
 makeRing(.79,-.60,.32,-.55,.64),
 makeRing(.91,.30,.92,.34,.50)
];

const ringHalo=rings.map(r=>{
 const c=r.clone();
 c.material=r.material.clone();
 c.material.opacity=.07;
 c.userData.speed=r.userData.speed*.60;
 c.userData.base=.07;
 c.userData.visualScale=1;
 root.add(c);return c;
});

/* pontos de energia, mas contidos no núcleo */
const ep=[];
for(let i=0;i<34;i++){
 const a=seeded(i)*Math.PI*2, r=.57+seeded(i+40)*.35;
 ep.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));
}
const eg=new THREE.BufferGeometry().setFromPoints(ep);
const em=new THREE.PointsMaterial({color:ORANGE_BRIGHT,size:.025,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false});
const energyPts=new THREE.Points(eg,em);
energyPts.rotation.x=1.0;
root.add(energyPts);

/* ===== CAMPO DE ESTRELAS ===== */
const starCount=650;
const starPos=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const r=1.8+seeded(i+800)*2.8;
  const a=seeded(i+900)*Math.PI*2;
  const z=(seeded(i+1000)-.5)*3.4;
  starPos[i*3]=Math.cos(a)*r;
  starPos[i*3+1]=Math.sin(a)*r*.72;
  starPos[i*3+2]=z;
}
const sg=new THREE.BufferGeometry();
sg.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const sm=new THREE.PointsMaterial({color:ORANGE,size:.012,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false});
const stars=new THREE.Points(sg,sm);
scene.add(stars);

/* ===== PARTÍCULAS NAS ÓRBITAS ===== */
const orbiters=[];
function makeOrbiter(){
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
 s.scale.set(.12,.12,1); root.add(s); orbiters.push({sprite:s,ring:0,t:Math.random(),speed:1});
 return s;
}
for(let i=0;i<6;i++) makeOrbiter();
const desiredParticles={online:0,ouvindo:1,pensando:2,pesquisando:0,executando:0,respondendo:0,offline:0};
let researchProgress=0;
let phaseClock=0;
const progressSteps=[10,20,40,60,80,100];
function activeParticleCount(){
 if(state==='pesquisando'||state==='executando'){
   let n=0;
   for(const step of progressSteps) if(researchProgress>=step) n++;
   return n;
 }
 return desiredParticles[state]||0;
}
function updateOrbiters(now){
 const count=activeParticleCount();
 for(let i=0;i<orbiters.length;i++){
   const o=orbiters[i];
   o.sprite.material.opacity = i<count ? 0.96 : 0;
   if(i<count){
     o.ring=i%3;
     o.speed=state==='ouvindo'?1.35:state==='pensando'?(1.05+i*.12):state==='pesquisando'?(1.15+i*.09):state==='executando'?(1.5+i*.12):1;
     o.t=(o.t + 0.0007*o.speed*(state==='executando'?1.5:1))%1;
     const ring=rings[o.ring];
     const rr=[.66,.79,.91][o.ring];
     const a=o.t*Math.PI*2;
     const p=new THREE.Vector3(Math.cos(a)*rr,Math.sin(a)*rr,0);
     p.applyEuler(ring.rotation);
     o.sprite.position.copy(p);
     const pulse=.95+.18*Math.sin(now*.008+i*1.7);
     o.sprite.scale.setScalar(.10*pulse);
   }
 }
}
function placeOrbiter(o,i,now){
 const ring=rings[i%3];
 const a=o.t + now*0.00035*o.speed;
 const rr=[.66,.79,.91][i%3];
 const p=new THREE.Vector3(Math.cos(a)*rr,Math.sin(a)*rr,0);
 p.applyEuler(ring.rotation);
 o.sprite.position.copy(p);
 o.sprite.material.opacity=1;
}


/* ===== ESTADOS ===== */
const states={
 online:{label:"ONLINE",energy:.72,rot:.48,pulse:.12,glow:.55,title:"Pronta para você.",sub:"Aguardando sua solicitação."},

 executando:{label:"EXECUTANDO",energy:1.30,rot:1.32,pulse:.72,glow:.98,title:"Executando sua solicitação.",sub:"Processando a tarefa."},
 respondendo:{label:"RESPONDENDO",energy:1.08,rot:.88,pulse:.64,glow:.86,title:"Aqui está sua resposta.",sub:"Preparando a resposta."},
 erro:{label:"ERRO",energy:.25,rot:.08,pulse:.08,glow:.12,title:"Não consegui concluir.",sub:"Verifique a conexão com o núcleo."},
 offline:{label:"OFFLINE",energy:.12,rot:.04,pulse:0,glow:0,title:"STACY está offline.",sub:"Tentando reconectar..."}
};
let state="online", current={...states.online}, target={...states.online};

const status=document.getElementById("status");
const infoText=document.getElementById("infoText");
const progress=document.getElementById("progress");

function setState(name){
 if(!states[name]) name="erro";
 state=name; target={...states[name]};
 if(name==='pesquisando'||name==='executando'){ researchProgress=0; phaseClock=0; }
 if(name==='online'||name==='ouvindo'||name==='pensando'||name==='respondendo'||name==='offline'){ phaseClock=0; }
 app.classList.toggle("responding",name==="respondendo");
 status.textContent=target.label;
 status.classList.toggle("status-online",name==="online");
 status.classList.toggle("status-offline",name==="offline"||name==="erro");
 if(name==='respondendo') document.getElementById('responseBubble').textContent='Encontrei o que você pediu. Estou organizando os resultados.';
 const active=["pesquisando","executando"].includes(name);
 progress.style.display=active?"block":"none";
 if(name==="pesquisando")infoText.textContent="Pesquisa em andamento";
 else if(name==="executando")infoText.textContent="Execução em andamento";
 else if(name==="offline")infoText.textContent="Serviços indisponíveis";
 else if(name==="erro")infoText.textContent="Falha na comunicação com o núcleo";
 else infoText.textContent="Núcleo STACY • sistema operacional";
}

/* INTERFACE DEFINITIVA: o toque no orbe NÃO altera estados.
   Os estados são controlados exclusivamente pelos eventos reais do Android/CORE. */

/* ===== COMPOSER ===== */
const message=document.getElementById("message");
document.getElementById("plus").onclick=()=>{
 message.focus();message.value=message.value?message.value+" ":"";
};
document.getElementById("mic").onclick=()=>{
 if(window.Android && typeof Android.stacyVoice==="function"){
   message.placeholder="Ouvindo...";
   Android.stacyVoice();
 }else{
   window.stacyNativeState && window.stacyNativeState("erro");
 }
};
document.getElementById("send").onclick=()=>{
 const text=message.value.trim();
 if(!text)return;
 if(window.Android && typeof Android.stacySend==="function"){
   message.value="";
   window.stacyNativeState && window.stacyNativeState("pensando");
   Android.stacySend(text);
 }else{
   window.stacyNativeResponse && window.stacyNativeResponse("A ponte nativa da STACY não está disponível.","erro");
 }
};

/* ===== layout ===== */
function resize(){
 const w=Math.max(1,sceneBox.clientWidth),h=Math.max(1,sceneBox.clientHeight);
 renderer.setSize(w,h,false);
 camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();

let last=performance.now(),time=0;
function animate(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 phaseClock+=dt;
 if(state==='pesquisando'||state==='executando'){
   researchProgress=Math.min(100,(phaseClock/8)*100);
   if(researchProgress>=100 && state==='pesquisando'){
     setState('respondendo');
   }
 }

 current.energy=lerp(current.energy,target.energy,.055);
 current.rot=lerp(current.rot,target.rot,.055);
 current.pulse=lerp(current.pulse,target.pulse,.06);
 current.glow=lerp(current.glow,target.glow,.055);

 const breath=Math.sin(time*1.45)*.5+.5;
 const globalScale=.94+(breath-.5)*.018;
 root.scale.setScalar(globalScale);

 /* Movimento contínuo: nunca zeramos a rotação dos anéis */
 root.rotation.y+=dt*.045*current.rot;
 particles.rotation.y-=dt*(.055+.04*current.rot);
 energyPts.rotation.z+=dt*(.09+.045*current.rot);

 for(let i=0;i<rings.length;i++){
   const r=rings[i],h=ringHalo[i];
   r.rotation.z+=dt*r.userData.speed*(.72+.28*current.rot);
   h.rotation.z+=dt*h.userData.speed*(.72+.28*current.rot);
   const ringTargetScale = state === "offline" ? .56 : 1.0;
   r.userData.visualScale=lerp(r.userData.visualScale,ringTargetScale,.065);
   h.userData.visualScale=lerp(h.userData.visualScale,ringTargetScale,.065);
   r.scale.setScalar(r.userData.visualScale);
   h.scale.setScalar(h.userData.visualScale);
   r.material.opacity=r.userData.base*(.58+current.glow*.62+current.pulse*.25);
   h.material.opacity=.045+current.glow*.035;
 }

 particleMat.uniforms.uTime.value=time;
 particleMat.uniforms.uEnergy.value=current.energy;
 particleMat.uniforms.uPulse.value=current.pulse;
 updateOrbiters(now);

 glow.scale.setScalar(.88+current.glow*.16+current.pulse*.08);
 glow.material.opacity=state === "offline" ? .055 : .45+current.glow*.28+current.pulse*.10;
 coreGlow.scale.setScalar(state === "offline" ? .23 : .32+current.glow*.09+current.pulse*.06);
 coreGlow.material.opacity=state === "offline" ? .035 : .65+current.glow*.30;

 em.opacity=.24+current.energy*.28;

 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}
setState("online");
requestAnimationFrame(animate);
</script>

<script>
(function(){
  const view=document.getElementById('stacySectionView');
  const title=document.getElementById('stacySectionTitle');
  const kicker=document.getElementById('stacySectionKicker');
  const body=document.getElementById('stacySectionBody');
  const back=document.getElementById('stacySectionBack');

  const pages={
    tarefas:{title:'Tarefas',kicker:'PLANEJAMENTO',html:'<div class="stacy-card"><div class="stacy-card-label">AGENDA DE TAREFAS</div><div class="stacy-card-title">Tarefas reais</div><div class="stacy-card-text">A STACY consulta o CORE para listar e organizar suas tarefas.</div><button class="stacy-action" data-stacy-action="tarefas">ATUALIZAR TAREFAS</button></div><div class="stacy-empty"><div><strong>Aguardando consulta</strong>Toque em atualizar para solicitar as tarefas ao núcleo.</div></div>'},
    conversas:{title:'Conversas',kicker:'HISTÓRICO',html:'<div class="stacy-card"><div class="stacy-card-label">HISTÓRICO</div><div class="stacy-card-title">Conversas da STACY</div><div class="stacy-card-text">Solicite ao CORE o histórico ou peça para continuar uma conversa anterior.</div><button class="stacy-action" data-stacy-action="conversas">ATUALIZAR CONVERSAS</button></div>'},
    pesquisa:{title:'Pesquisa',kicker:'INTELIGÊNCIA',html:'<div class="stacy-card"><div class="stacy-card-label">PESQUISA</div><div class="stacy-card-title">Centro de pesquisa</div><div class="stacy-card-text">A consulta abaixo é enviada diretamente ao CORE.</div><div class="stacy-action-row"><input class="stacy-input" id="stacyResearchInput" placeholder="O que deseja pesquisar?"><button class="stacy-action" data-stacy-action="pesquisa">PESQUISAR</button></div></div>'},
    calendario:{title:'Calendário',kicker:'AGENDA',html:'<div class="stacy-card"><div class="stacy-card-label">COMPROMISSOS</div><div class="stacy-card-title">Agenda real</div><div class="stacy-card-text">Solicite ao CORE os compromissos e eventos disponíveis.</div><button class="stacy-action" data-stacy-action="calendario">CONSULTAR AGENDA</button></div>'},
    memoria:{title:'Memória',kicker:'NÚCLEO DE MEMÓRIA',html:'<div class="stacy-card"><div class="stacy-card-label">MEMÓRIA</div><div class="stacy-card-title">Contexto da STACY</div><div class="stacy-card-text">Consulte o estado atual da memória pelo núcleo.</div><button class="stacy-action" data-stacy-action="memoria">CONSULTAR MEMÓRIA</button></div>'},
    config:{title:'Configurações',kicker:'SISTEMA',html:'<div class="stacy-card"><div class="stacy-setting-row"><div><div class="stacy-setting-name">Voz da STACY</div><div class="stacy-setting-desc">Ativar ou silenciar respostas faladas.</div></div><button class="stacy-action small" data-stacy-action="voz">VOZ: <span id="voiceSetting">ATIVA</span></button></div><div class="stacy-setting-row"><div><div class="stacy-setting-name">Animações</div><div class="stacy-setting-desc">Controlar o movimento visual do núcleo.</div></div><button class="stacy-action small" data-stacy-action="animacoes">ANIMAÇÕES: <span id="animSetting">ATIVAS</span></button></div><div class="stacy-setting-row"><div><div class="stacy-setting-name">Privacidade e permissões</div><div class="stacy-setting-desc">Abrir as permissões e configurações do aplicativo.</div></div><button class="stacy-action small" data-stacy-action="privacidade">ABRIR</button></div><div class="stacy-setting-row"><div><div class="stacy-setting-name">Atualização da STACY</div><div class="stacy-setting-desc">Verificar uma nova versão oficial, validar o pacote e iniciar a atualização.</div><div class="stacy-update-status" id="stacyUpdateStatus">Pronta para verificar.</div></div><button class="stacy-action small" data-stacy-action="atualizacao">VERIFICAR</button></div></div>'},
    sobre:{title:'Sobre',kicker:'IDENTIDADE',html:'<div class="stacy-card"><div class="stacy-card-label">STACY AI</div><div class="stacy-card-title">Assistente pessoal inteligente</div><div class="stacy-card-text">Núcleo visual, voz, memória, pesquisa, automação e integrações reunidos em uma única experiência.</div><button class="stacy-action" data-stacy-action="status">VERIFICAR NÚCLEO</button></div><div class="stacy-card"><div class="stacy-card-label">IDENTIDADE VISUAL</div><div class="stacy-card-title">Átomo · Espaço · Laranja</div><div class="stacy-card-text">Interface definitiva em evolução contínua.</div></div>'}
  };

  function openPage(key){
    const p=pages[key];
    if(!p)return;
    title.textContent=p.title;
    kicker.textContent=p.kicker;
    body.innerHTML=p.html;
    view.classList.add('open');
    view.setAttribute('aria-hidden','false');
    document.body.classList.add('stacy-section-active');
  }
  function closePage(){
    view.classList.remove('open');
    view.setAttribute('aria-hidden','true');
    document.body.classList.remove('stacy-section-active');
  }
  back.addEventListener('click',()=>{
    const drawer=document.getElementById('stacyDrawer');
    const backdrop=document.getElementById('stacyDrawerBackdrop');
    drawer.classList.remove('open');
    backdrop.classList.remove('open');
    closePage();
  });

  document.querySelectorAll('[data-stacy-nav]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.getAttribute('data-stacy-nav');
      if(key==='inicio'){closePage();return;}
      openPage(key);
    });
  });
})();
</script>
<script>
/* ===== STACY DEFINITIVA: controle exclusivamente por eventos reais ===== */
(function(){
  const stateMap={pesquisa:'pesquisando',pesquisando:'pesquisando',research:'pesquisando',execucao:'executando',execução:'executando',executando:'executando',execution:'executando',task:'executando',erro:'erro',error:'erro',ouvindo:'ouvindo',listening:'ouvindo',pensando:'pensando',thinking:'pensando',respondendo:'respondendo',resposta:'respondendo',online:'online',offline:'offline'};
  window.stacyNativeState=function(name){
    const key=String(name||'').toLowerCase();
    setState(stateMap[key]||key||'online');
  };
  window.stacyNativeResponse=function(response,tipo){
    const text=String(response||'').trim();
    if(!text)return;
    const mapped=stateMap[String(tipo||'').toLowerCase()]||'respondendo';
    const bubble=document.getElementById('responseBubble');
    if(bubble)bubble.textContent=text;
    setState(mapped==='erro'?'erro':'respondendo');
  };
  function nativeSend(text){
    const value=String(text||'').trim();
    if(!value)return;
    if(window.Android && typeof Android.stacySend==='function'){
      window.stacyNativeState('pensando');
      Android.stacySend(value);
    }else{
      window.stacyNativeResponse('A ponte nativa da STACY não está disponível.','erro');
    }
  }
  window.stacyNativeSend=nativeSend;
  window.stacyNativeUpdateStatus=function(status){
    const el=document.getElementById('stacyUpdateStatus');
    if(el)el.textContent=String(status||'');
  };
  document.body.addEventListener('click',function(e){
    const action=e.target.closest('[data-stacy-action]');
    if(!action)return;
    const key=action.getAttribute('data-stacy-action');
    if(key==='voz'){
      const enabled=action.dataset.enabled!=='false';
      const next=!enabled;
      action.dataset.enabled=String(!next);
      const label=document.getElementById('voiceSetting');
      if(label)label.textContent=next?'ATIVA':'SILENCIADA';
      if(window.Android && typeof Android.stacySetVoiceEnabled==='function')Android.stacySetVoiceEnabled(next);
      return;
    }
    if(key==='animacoes'){
      const disabled=!document.body.classList.contains('stacy-no-animations');
      document.body.classList.toggle('stacy-no-animations',disabled);
      const label=document.getElementById('animSetting');
      if(label)label.textContent=disabled?'DESATIVADAS':'ATIVAS';
      return;
    }
    if(key==='privacidade'){
      if(window.Android && typeof Android.stacyOpenAppSettings==='function')Android.stacyOpenAppSettings();
      return;
    }
    if(key==='atualizacao'){
      const status=document.getElementById('stacyUpdateStatus');
      if(status)status.textContent='Verificando…';
      if(window.Android && typeof Android.stacyCheckUpdate==='function'){
        Android.stacyCheckUpdate();
      }else if(status){
        status.textContent='Ponte nativa indisponível.';
      }
      return;
    }
    const commands={
      tarefas:'Liste minhas tarefas pendentes e agendadas.',
      conversas:'Mostre o histórico recente das minhas conversas.',
      calendario:'Consulte minha agenda e próximos compromissos.',
      memoria:'Mostre o estado atual da memória da STACY.',
      status:'Verifique o status operacional do núcleo STACY.'
    };
    if(key==='pesquisa'){
      const input=document.getElementById('stacyResearchInput');
      nativeSend(input?input.value:'');
      return;
    }
    if(commands[key])nativeSend(commands[key]);
  });
})();
</script>
