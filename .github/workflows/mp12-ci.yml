name: STACY Final CI

on:
  push:
    branches:
      - main
      - post-mp12-correcoes-20260922
  pull_request:
    branches:
      - main

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py
      - run: python -m unittest discover -v
      - run: |
          python - <<'PY'
          import ctac, mepo
          assert mepo.validar_sequencia()
          assert all(item["status"] == "fechado" for item in mepo.listar())
          assert mepo.proximo_aberto() is None
          assert ctac.validar_coerencia()["coerente"]
          print("STACY FINAL: MP-01..MP-12 fechados")
          PY
