name: STACY Android CI

on:
  push:
    branches:
      - main
      - mp08-automacao-android-20260922
      - stacy-final-android-20260924
      - mp-ef10-android-assistant-ready
  pull_request:
    branches:
      - mp08-automacao-android-20260922
      - main
      - mp01-cortex-routing-20260921

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Patch STACY web animation states
        working-directory: .
        run: python scripts/fix_stacy_web_animation.py

      - name: Validate STACY web console
        working-directory: .
        run: |
          grep -F 'stacy-core-v1' android/app/src/main/assets/stacy_prototipo36.html
          grep -F 'window.stacyNativeResponse' android/app/src/main/assets/stacy_prototipo36.html

      - name: Build and unit tests
        run: gradle assembleDebug testDebugUnitTest

      - name: Upload STACY APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STACY-final-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed STACY update channel
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STACY_KEYSTORE_BASE64: ${{ secrets.STACY_KEYSTORE_BASE64 }}
          STACY_KEYSTORE_PASSWORD: ${{ secrets.STACY_KEYSTORE_PASSWORD }}
          STACY_KEY_ALIAS: ${{ secrets.STACY_KEY_ALIAS }}
          STACY_KEY_PASSWORD: ${{ secrets.STACY_KEY_PASSWORD }}
          STACY_UPDATES_TOKEN: ${{ secrets.STACY_UPDATES_TOKEN }}
        run: bash ../scripts/publish_stacy_update.sh
