name: STACY Android CI

on:
  push:
    branches:
      - main
      - mp08-automacao-android-20260922
      - stacy-final-android-20260924
      - mp-ef10-android-assistant-ready
      - stacy-prototipo36-core-integration-20261005
  pull_request:
    branches:
      - mp08-automacao-android-20260922
      - main
      - mp01-cortex-routing-20260921

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build and unit tests
        run: gradle assembleDebug testDebugUnitTest

      - name: Upload STACY APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STACY-final-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


  release-bootstrap:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: bootstrap updater' || github.event.head_commit.message == 'fix: bootstrap updater metadata'
    runs-on: ubuntu-latest
    env:
      STACY_KEYSTORE_PASSWORD: ${{ secrets.STACY_KEYSTORE_PASSWORD }}
      STACY_KEY_ALIAS: ${{ secrets.STACY_KEY_ALIAS }}
      STACY_KEY_PASSWORD: ${{ secrets.STACY_KEY_PASSWORD }}
      STACY_UPDATES_TOKEN: ${{ secrets.STACY_UPDATES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore keystore
        env:
          STACY_KEYSTORE_BASE64: ${{ secrets.STACY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$STACY_KEYSTORE_BASE64"
          echo "$STACY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stacy-release.jks"
          test -s "$RUNNER_TEMP/stacy-release.jks"
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -1)"
          test -n "$APKSIGNER"; test -n "$AAPT"
          echo "$(dirname "$APKSIGNER")" >> "$GITHUB_PATH"
      - name: Build Release
        working-directory: android
        env:
          STACY_KEYSTORE_PATH: ${{ runner.temp }}/stacy-release.jks
        run: |
          set -euo pipefail
          gradle assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Verify and metadata
        id: meta
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$APK"
          BADGING="$(aapt dump badging "$APK")"
          VC="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          VN="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          PKG="$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\\([^']*\\)'.*/\\1/p")"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          CERT="$(apksigner verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':')"
          test "$PKG" = com.mrmorning.stacy; test -n "$VC"; test -n "$VN"; test -n "$SHA"; test -n "$CERT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
      - name: Publish update channel
        run: |
          set -euo pipefail
          API=https://api.github.com
          REPO=MrMorningw/STACY--UPDATES
          AUTH="Authorization: Bearer $STACY_UPDATES_TOKEN"
          curl -fsS -H "Accept: application/vnd.github+json" -H "$AUTH" -H "X-GitHub-Api-Version: 2026-03-10" "$API/repos/$REPO" >/dev/null
          APK=android/app/build/outputs/apk/release/app-release.apk
          VN="${{ steps.meta.outputs.version_name }}"
          VC="${{ steps.meta.outputs.version_code }}"
          SHA="${{ steps.meta.outputs.sha256 }}"
          CERT="${{ steps.meta.outputs.cert }}"
          python3 - "$APK" "$VN" "$VC" "$SHA" "$CERT" > "$RUNNER_TEMP/payload.json" <<'PY'
import base64,json,sys
apk,vn,vc,sha,cert=sys.argv[1:]
with open(apk,'rb') as f: data=base64.b64encode(f.read()).decode()
print(json.dumps({'message':f'release: STACY {vn} APK','content':data,'branch':'main'}))
PY
          curl -fsS -X PUT -H "Accept: application/vnd.github+json" -H "$AUTH" -H "X-GitHub-Api-Version: 2026-03-10" --data-binary "@$RUNNER_TEMP/payload.json" "$API/repos/$REPO/contents/releases/STACY-$VN.apk" >/dev/null
          cat > "$RUNNER_TEMP/update.json" <<EOF
{"versionCode":$VC,"versionName":"$VN","packageName":"com.mrmorning.stacy","minAndroid":26,"sha256":"$SHA","signingCertificateSha256":"$CERT","assets":[{"name":"STACY-$VN.apk","version_code":$VC,"digest":"sha256:$SHA","browser_download_url":"https://raw.githubusercontent.com/MrMorningw/STACY--UPDATES/main/releases/STACY-$VN.apk"}]}
EOF
          python3 - "$RUNNER_TEMP/update.json" > "$RUNNER_TEMP/meta-payload.json" <<'PY'
import base64,json,sys
p=sys.argv[1]
with open(p,'rb') as f: data=base64.b64encode(f.read()).decode()
print(json.dumps({'message':'release: STACY update metadata','content':data,'branch':'main'}))
PY
          curl -fsS -X PUT -H "Accept: application/vnd.github+json" -H "$AUTH" -H "X-GitHub-Api-Version: 2026-03-10" --data-binary "@$RUNNER_TEMP/meta-payload.json" "$API/repos/$REPO/contents/update.json" >/dev/null
