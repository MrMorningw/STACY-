name: STACY Android CI

on:
  push:
    branches:
      - main
      - mp08-automacao-android-20260922
      - stacy-final-android-20260924
  pull_request:
    branches:
      - mp08-automacao-android-20260922
      - main
      - mp01-cortex-routing-20260921

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build and unit tests
        run: gradle assembleDebug testDebugUnitTest

      - name: Upload STACY APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STACY-final-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
