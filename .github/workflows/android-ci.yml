name: STACY Android CI

on:
  push:
    branches:
      - main
      - mp08-automacao-android-20260922
      - stacy-final-android-20260924
      - mp-ef10-android-assistant-ready
  pull_request:
    branches:
      - mp08-automacao-android-20260922
      - main
      - mp01-cortex-routing-20260921

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Patch STACY web animation states
        working-directory: .
        run: python scripts/fix_stacy_web_animation.py

      - name: Validate STACY web animation states
        working-directory: .
        run: grep -F 'online:0,ouvindo:1,pensando:2,pesquisando:1,executando:1,respondendo:2' android/app/src/main/assets/stacy_prototipo36.html
      - name: Validate native CORE contract
        working-directory: .
        run: |
          grep -F 'data-stacy-action="configurarIA"' android/app/src/main/assets/stacy_prototipo36.html
          grep -F 'StacyAiClient' android/app/src/main/java/com/mrmorning/stacy/StacyCoreBridge.kt
          grep -F 'CREATE TABLE tasks' android/app/src/main/java/com/mrmorning/stacy/StacyLocalStore.kt
          grep -F 'v1beta/interactions' android/app/src/main/java/com/mrmorning/stacy/StacyAiClient.kt
          grep -F 'previous_interaction_id' android/app/src/main/java/com/mrmorning/stacy/StacyAiClient.kt
          grep -F '"type", "google_search"' android/app/src/main/java/com/mrmorning/stacy/StacyAiClient.kt
          if grep -F '"temperature"' android/app/src/main/java/com/mrmorning/stacy/StacyAiClient.kt; then exit 1; fi
          if grep -F 'RUN_COMMAND' android/app/src/main/java/com/mrmorning/stacy/StacyCoreBridge.kt; then exit 1; fi
          if grep -F 'com.termux' android/app/src/main/AndroidManifest.xml; then exit 1; fi
          python -c "from pathlib import Path; p=Path('android/app/src/main/assets/stacy_prototipo36.html'); assert len(p.read_text(encoding='utf-8')) > 170000"


      - name: Validate inline JavaScript syntax
        working-directory: .
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          html = Path("android/app/src/main/assets/stacy_prototipo36.html").read_text(encoding="utf-8")

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = {"attrs": attrs, "parts": []}

              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append(self.current)
                      self.current = None

          parser = InlineScriptParser()
          parser.feed(html)
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for index, script in enumerate(parser.scripts):
                  attrs = script["attrs"]
                  source = "".join(script["parts"])
                  if attrs.get("src") or not source.strip():
                      continue
                  suffix = ".mjs" if attrs.get("type", "").lower() == "module" else ".js"
                  file = Path(tmp) / f"inline-{index}{suffix}"
                  file.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(file)], check=True)
                  checked += 1
          if checked == 0:
              raise SystemExit("No inline JavaScript blocks were validated.")
          print(f"Validated JavaScript syntax in {checked} inline script blocks.")
          PY

      - name: Build and unit tests
        run: gradle assembleDebug testDebugUnitTest

      - name: Upload STACY APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STACY-final-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed STACY update channel
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STACY_KEYSTORE_BASE64: ${{ secrets.STACY_KEYSTORE_BASE64 }}
          STACY_KEYSTORE_PASSWORD: ${{ secrets.STACY_KEYSTORE_PASSWORD }}
          STACY_KEY_ALIAS: ${{ secrets.STACY_KEY_ALIAS }}
          STACY_KEY_PASSWORD: ${{ secrets.STACY_KEY_PASSWORD }}
          STACY_UPDATES_TOKEN: ${{ secrets.STACY_UPDATES_TOKEN }}
        run: bash ../scripts/publish_stacy_update.sh
