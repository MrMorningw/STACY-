name: STACY Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile *.py

      - name: Validate Termux bootstrap syntax
        run: bash -n termux_repair.sh android/termux_widget/stacy-core-daemon.sh

      - name: Core regression tests
        run: python -m unittest discover -v

      - name: Validate closed MPEF sequence
        run: |
          python - <<'PY'
          import ctac, mepo
          assert mepo.validar_sequencia()
          assert all(item["status"] == "fechado" for item in mepo.listar())
          assert mepo.proximo_aberto() is None
          assert ctac.validar_coerencia()["coerente"]
          print("STACY CORE: MP-01..MP-12 fechados e CTAC coerente")
          PY
