name: STACY Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile *.py

      - name: Validate Termux-independent runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_files = [
              Path("stacy.py"),
              Path("interface.py"),
              Path("ai.py"),
              Path("android_core.py"),
              Path("android_session.py"),
              Path("core_server.py"),
              Path("android/app/src/main/AndroidManifest.xml"),
              Path("android/app/src/main/java/com/mrmorning/stacy/MainActivity.kt"),
              Path("android/app/src/main/java/com/mrmorning/stacy/StacyCoreBridge.kt"),
          ]
          forbidden = (
              "termux-speech-to-text",
              "termux-tts-speak",
              "termux-notification",
              "com.termux.permission.RUN_COMMAND",
              "/system/bin/am",
              "stacycorephasereceiver",
              "termux launches",
              "android/termux_widget",
          )
          for path in runtime_files:
              text = path.read_text(encoding="utf-8").lower()
              for token in forbidden:
                  assert token.lower() not in text, f"{token} remains in {path}"
          assert not Path("termux_repair.sh").exists()
          assert not Path("android/termux_widget").exists()
          print("STACY runtime: no Termux bootstrap or command integration")
          PY

      - name: Core regression tests
        run: python -m unittest discover -v

      - name: Validate closed MPEF sequence
        run: |
          python - <<'PY'
          import ctac, mepo
          assert mepo.validar_sequencia()
          assert all(item["status"] == "fechado" for item in mepo.listar())
          assert mepo.proximo_aberto() is None
          assert ctac.validar_coerencia()["coerente"]
          print("STACY CORE: MP-01..MP-12 fechados e CTAC coerente")
          PY
