name: STACY Release and Update Channel

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      STACY_KEYSTORE_PASSWORD: ${{ secrets.STACY_KEYSTORE_PASSWORD }}
      STACY_KEY_ALIAS: ${{ secrets.STACY_KEY_ALIAS }}
      STACY_KEY_PASSWORD: ${{ secrets.STACY_KEY_PASSWORD }}
      STACY_UPDATES_TOKEN: ${{ secrets.STACY_UPDATES_TOKEN }}
    steps:
      - name: Checkout STACY
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore release keystore
        working-directory: android
        env:
          STACY_KEYSTORE_BASE64: ${{ secrets.STACY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$STACY_KEYSTORE_BASE64"
          echo "$STACY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stacy-release.jks"
          test -s "$RUNNER_TEMP/stacy-release.jks"

      - name: Configure Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT/build-tools"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -1)"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          BUILD_TOOLS_DIR="$(dirname "$APKSIGNER")"
          test "$BUILD_TOOLS_DIR" = "$(dirname "$AAPT")"

          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          echo "Android Build Tools: $BUILD_TOOLS_DIR"
          echo "apksigner: $APKSIGNER"
          echo "aapt: $AAPT"

      - name: Build signed Release APK
        working-directory: android
        env:
          STACY_KEYSTORE_PATH: ${{ runner.temp }}/stacy-release.jks
        run: |
          set -euo pipefail
          gradle assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          command -v apksigner
          command -v aapt
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"

      - name: Read version and integrity
        id: metadata
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING="$(aapt dump badging "$APK")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\\([^']*\\)'.*/\\1/p")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          CERT_SHA256="$(apksigner verify --print-certs "$APK" | sed -n "s/.*certificate SHA-256 digest: //p" | head -n 1 | tr -d ':')"
          test "$PACKAGE_NAME" = "com.mrmorning.stacy"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$SHA256"
          test -n "$CERT_SHA256"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STACY-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to STACY--UPDATES
        if: env.STACY_UPDATES_TOKEN != ''
        env:
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
          CERT_SHA256: ${{ steps.metadata.outputs.cert_sha256 }}
        run: |
          set -euo pipefail

          API="https://api.github.com"
          REPO="MrMorningw/STACY--UPDATES"
          AUTH="Authorization: Bearer $STACY_UPDATES_TOKEN"

          echo "Validando acesso ao canal de atualizações..."
          HTTP_CODE="$(curl -sS -o "$RUNNER_TEMP/stacy-repo.json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "$AUTH" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$API/repos/$REPO")"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::STACY_UPDATES_TOKEN não possui acesso válido ao repositório $REPO (HTTP $HTTP_CODE)."
            exit 1
          fi

          put_file() {
            local repo_path="$1"
            local source_file="$2"
            local message="$3"
            local lookup="$RUNNER_TEMP/stacy-lookup.json"
            local payload="$RUNNER_TEMP/stacy-payload.json"
            local code
            local sha=""

            code="$(curl -sS -o "$lookup" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "$AUTH" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$API/repos/$REPO/contents/$repo_path?ref=main")"

            if [ "$code" = "200" ]; then
              sha="$(jq -r '.sha // empty' "$lookup")"
            elif [ "$code" != "404" ]; then
              echo "::error::Falha ao consultar $repo_path (HTTP $code)."
              cat "$lookup"
              exit 1
            fi

            python3 - "$source_file" "$message" "$sha" > "$payload" <<'PY'
import base64
import json
import sys

source, message, sha = sys.argv[1], sys.argv[2], sys.argv[3]
with open(source, "rb") as f:
    content = base64.b64encode(f.read()).decode("ascii")

body = {
    "message": message,
    "content": content,
    "branch": "main",
    "committer": {
        "name": "STACY Release Bot",
        "email": "stacy-release-bot@users.noreply.github.com",
    },
}
if sha:
    body["sha"] = sha

json.dump(body, sys.stdout, separators=(",", ":"))
PY

            curl -fsS -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "$AUTH" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --data-binary "@$payload" \
              "$API/repos/$REPO/contents/$repo_path" > "$RUNNER_TEMP/stacy-publish.json"

            jq -e '.content.sha' "$RUNNER_TEMP/stacy-publish.json" >/dev/null
            echo "Publicado: $repo_path"
          }

          APK_NAME="STACY-$VERSION_NAME.apk"
          APK_PATH="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"

          mkdir -p "$RUNNER_TEMP/stacy-release-meta"
          cat > "$RUNNER_TEMP/stacy-release-meta/update.json" <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "packageName": "com.mrmorning.stacy",
            "minAndroid": 26,
            "sha256": "$SHA256",
            "signingCertificateSha256": "$CERT_SHA256",
            "assets": [
              {
                "name": "$APK_NAME",
                "version_code": $VERSION_CODE,
                "digest": "sha256:$SHA256",
                "browser_download_url": "https://raw.githubusercontent.com/MrMorningw/STACY--UPDATES/main/releases/$APK_NAME"
              }
            ]
          }
          EOF

          put_file "releases/$APK_NAME" "$APK_PATH" "release: STACY $VERSION_NAME APK"
          put_file "update.json" "$RUNNER_TEMP/stacy-release-meta/update.json" "release: STACY $VERSION_NAME metadata"

      - name: Verify published update channel
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail
          UPDATE_URL="https://raw.githubusercontent.com/MrMorningw/STACY--UPDATES/main/update.json"
          APK_URL="https://raw.githubusercontent.com/MrMorningw/STACY--UPDATES/main/releases/STACY-$VERSION_NAME.apk"

          curl -fsSL "$UPDATE_URL" -o "$RUNNER_TEMP/stacy-public-update.json"
          jq -e '.versionName and .versionCode and .assets[0].browser_download_url' "$RUNNER_TEMP/stacy-public-update.json" >/dev/null
          curl -fsSLI "$APK_URL" >/dev/null
          echo "Canal público STACY verificado."
