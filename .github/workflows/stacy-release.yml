name: STACY Release and Update Channel

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      STACY_KEYSTORE_PASSWORD: ${{ secrets.STACY_KEYSTORE_PASSWORD }}
      STACY_KEY_ALIAS: ${{ secrets.STACY_KEY_ALIAS }}
      STACY_KEY_PASSWORD: ${{ secrets.STACY_KEY_PASSWORD }}
      STACY_UPDATES_TOKEN: ${{ secrets.STACY_UPDATES_TOKEN }}
    steps:
      - name: Checkout STACY
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore release keystore
        working-directory: android
        env:
          STACY_KEYSTORE_BASE64: ${{ secrets.STACY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$STACY_KEYSTORE_BASE64"
          echo "$STACY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stacy-release.jks"
          test -s "$RUNNER_TEMP/stacy-release.jks"

      - name: Configure Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT/build-tools"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -1)"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          BUILD_TOOLS_DIR="$(dirname "$APKSIGNER")"
          test "$BUILD_TOOLS_DIR" = "$(dirname "$AAPT")"

          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          echo "Android Build Tools: $BUILD_TOOLS_DIR"
          echo "apksigner: $APKSIGNER"
          echo "aapt: $AAPT"

      - name: Build signed Release APK
        working-directory: android
        env:
          STACY_KEYSTORE_PATH: ${{ runner.temp }}/stacy-release.jks
        run: |
          set -euo pipefail
          gradle assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          command -v apksigner
          command -v aapt
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"

      - name: Read version and integrity
        id: metadata
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING="$(aapt dump badging "$APK")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/package: name='\\([^']*\\)'.*/\\1/p")"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          CERT_SHA256="$(apksigner verify --print-certs "$APK" | sed -n "s/.*certificate SHA-256 digest: //p" | head -n 1 | tr -d ':')"
          test "$PACKAGE_NAME" = "com.mrmorning.stacy"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$SHA256"
          test -n "$CERT_SHA256"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STACY-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to STACY--UPDATES
        if: env.STACY_UPDATES_TOKEN != ''
        env:
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
          CERT_SHA256: ${{ steps.metadata.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/stacy-updates"
          git clone "https://x-access-token:$STACY_UPDATES_TOKEN@github.com/MrMorningw/STACY--UPDATES.git" "$RUNNER_TEMP/stacy-updates"
          cd "$RUNNER_TEMP/stacy-updates"
          mkdir -p releases
          APK_NAME="STACY-$VERSION_NAME.apk"
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk" "releases/$APK_NAME"
          cat > update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "packageName": "com.mrmorning.stacy",
            "minAndroid": 26,
            "sha256": "$SHA256",
            "signingCertificateSha256": "$CERT_SHA256",
            "assets": [
              {
                "name": "$APK_NAME",
                "version_code": $VERSION_CODE,
                "digest": "sha256:$SHA256",
                "browser_download_url": "https://raw.githubusercontent.com/MrMorningw/STACY--UPDATES/main/releases/$APK_NAME"
              }
            ]
          }
          EOF
          git config user.name "STACY Release Bot"
          git config user.email "stacy-release-bot@users.noreply.github.com"
          git add update.json "releases/$APK_NAME"
          git commit -m "release: STACY $VERSION_NAME"
          git push origin main
